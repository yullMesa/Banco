<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MI PLATA - Panel de Transacciones</title>
  <link rel="stylesheet" href="../Style/banco.css">
</head>
<body class="dashboard-body">
  <!-- Sidebar de Navegación del Cajero -->
  <aside class="dashboard-sidebar">
    <div class="sidebar-brand">◆ MI PLATA</div>
    <nav class="sidebar-nav">
      <button class="nav-item" data-target="productos">Productos</button>
      <button class="nav-item active" data-target="resumen">Resumen y Saldo</button>
      <button class="nav-item" data-target="consignar">Consignar Dinero</button>
      <button class="nav-item" data-target="retirar">Retirar Dinero</button>
      <button class="nav-item" data-target="movimientos">Ver Movimientos</button>
      <button class="nav-item" data-target="transferir">Transferir</button>
      <button class="nav-item" data-target="perfil">Perfil y Seguridad</button>
      <button class="nav-item btn-logout" id="btn-cerrar-sesion">Cerrar Sesión</button>
    </nav>
  </aside>

  <!-- Área Principal de Contenido Dinámico -->
  <main class="dashboard-main">
    <header class="dashboard-topbar">
      <h2>Bienvenido, <span id="nombre-usuario-display">[Usuario]</span></h2>
      <div class="user-status-badge">Sesión Activa</div>
    </header>
    
    <!-- Contenedor que será modificado por los archivos JS de cada opción -->
    <div class="dashboard-content" id="dashboard-content">
      <!-- El contenido se inyectará dinámicamente aquí -->
    </div>
  </main>

  <!-- Script principal del Dashboard -->
  <script src="../vanilla/poo/banco-poo.js"></script>
  <script src="../vanilla/opciones/resumen.js"></script>
  <script src="../vanilla/opciones/consignar.js"></script>
  <script src="../vanilla/opciones/productos.js"></script>
  <script src="../vanilla/dashboard.js"></script>
  <script src="../vanilla/opciones/retirar.js"></script>
</body>
</html>
